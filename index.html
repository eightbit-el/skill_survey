<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>従業員スキル調査</title>
<style>
:root{
  --ink:#1c2340; --ink-2:#4a5170; --ink-3:#8b90a8; --paper:#f7f7f4; --card:#ffffff; --line:#d9dae3;
  --accent:#b07a12; --accent-soft:#f5e9c9; --sel:#e8ebf7; --ok:#2f7a4f; --ng:#b3382c;
  --radius:6px; --fs:15px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",system-ui,sans-serif;font-size:var(--fs);line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.01em}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:56px 1fr;min-height:100vh;align-items:start}
header.top{grid-column:1/-1;height:56px;display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--ink);color:#fff;overflow:hidden}
header.top h1{font-size:17px;font-weight:600;white-space:nowrap}
header.top .prog{flex:1;display:flex;align-items:center;gap:12px;font-size:13px;color:#cfd3e6;overflow:hidden}
header.top .prog span{white-space:nowrap}
header.top .bar{flex:1;height:6px;background:#3a4267;border-radius:3px;overflow:hidden;max-width:360px}
header.top .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
header.top .tools{white-space:nowrap}
header.top .tools button{background:transparent;border:1px solid #6a7199;color:#fff;border-radius:4px;padding:5px 10px;margin-left:6px;cursor:pointer}
header.top .tools button:hover{background:#2c3459}
nav.rail{background:#eef0f5;border-right:1px solid var(--line);padding:18px 0;height:calc(100vh - 56px);position:sticky;top:56px;overflow-y:auto}
nav.rail button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 18px;border:0;background:transparent;text-align:left;cursor:pointer;border-left:3px solid transparent;color:var(--ink-2)}
nav.rail button.active{background:#fff;border-left-color:var(--accent);color:var(--ink);font-weight:700}
nav.rail button .k{display:inline-block;min-width:22px;font-weight:700;color:var(--ink-3)}
nav.rail button.active .k{color:var(--accent)}
nav.rail button .t{flex:1}
nav.rail button .m{font-size:12px;color:var(--ink-3)}
nav.rail button.done .m{color:var(--ok)}
main{padding:28px 40px 80px;max-width:880px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.sec-head h2{font-size:22px}
.sec-head .est{color:var(--ink-3);font-size:13px}
.lead{color:var(--ink-2);margin:0 0 22px;max-width:70ch}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:14px}
.q.err{border-color:var(--ng);box-shadow:inset 3px 0 0 var(--ng)}
.q .qh{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.q .qid{font-size:12px;color:var(--ink-3);min-width:38px;font-variant-numeric:tabular-nums}
.q .qt{font-weight:700}
.q .req{color:var(--ng);font-size:12px;margin-left:4px}
.q .hint{font-size:13px;color:var(--ink-2);margin:-4px 0 10px 48px}
.q .body{margin-left:48px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;user-select:none}
.opt:hover{border-color:var(--ink-3)}
.opt.on{background:var(--sel);border-color:var(--ink);font-weight:600}
.opt input{display:none}
.opt.dis{opacity:.4;cursor:not-allowed}
select,input[type=text],input[type=search],textarea{padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;min-width:160px}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;min-height:70px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
table.mx{border-collapse:collapse;width:100%;font-size:14px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.mx th{font-weight:600;color:var(--ink-2);font-size:13px;background:#fafafc;position:sticky;top:0}
table.mx td.c{text-align:center}
table.mx tr:hover td{background:#fbfaf5}
.lvl{display:inline-block;width:32px;height:28px;line-height:26px;text-align:center;border:1px solid var(--line);border-radius:4px;cursor:pointer;background:#fff;font-size:13px}
.lvl.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.lvl.clear{width:auto;padding:0 8px;color:var(--ink-3);border-style:dashed}
.foot{display:flex;justify-content:space-between;margin-top:26px}
.btn{padding:9px 18px;border-radius:4px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;font-weight:600}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.small{padding:5px 12px;font-size:13px;font-weight:500}
.btn.warn{border-color:var(--ng);color:var(--ng);background:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--accent-soft);color:#6a4a0a;font-size:12px;margin-left:6px}
.msg{color:var(--ng);font-size:13px;margin-top:6px}
/* prefill table */
table.pre{border-collapse:collapse}
table.pre th{text-align:left;color:var(--ink-3);font-weight:500;padding:4px 18px 4px 0;font-size:13px}
table.pre td{padding:4px 0;font-weight:600}
/* timeline */
.tl{position:relative;margin:6px 0 18px;padding:10px 0 0;border-top:1px solid var(--line)}
.tl .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-bottom:4px}
.tl .lane{position:relative;height:30px;margin-bottom:4px}
.tl .barp{position:absolute;top:4px;height:22px;border-radius:3px;background:var(--sel);border:1px solid #aeb5d6;font-size:12px;line-height:20px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tl .barp.cur{background:var(--accent-soft);border-color:var(--accent)}
.tl .barp.act{outline:2px solid var(--ink)}
.plist{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.pcard{display:flex;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;cursor:pointer}
.pcard.act{border-color:var(--ink);background:var(--sel)}
.pcard .n{font-weight:700;min-width:60px}
.pcard .d{flex:1;color:var(--ink-2);font-size:13px}
.pcard .st{font-size:12px}
.pcard .st.ok{color:var(--ok)} .pcard .st.ng{color:var(--ng)}
.area-block{margin-bottom:12px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.area-block .ah{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#f2f3f8;cursor:pointer}
.area-block .ah .code{font-weight:700;color:var(--accent);min-width:20px}
.area-block .ah .pl{flex:1;font-size:13px;color:var(--ink-2)}
.area-block .ab{padding:8px 12px;display:none}
.area-block.open .ab{display:block}
.tasklist label{display:flex;gap:8px;padding:5px 4px;border-radius:4px;cursor:pointer;align-items:flex-start}
.tasklist label:hover{background:#fafafc}
.tasklist label.on{background:var(--sel)}
.tasklist input{margin-top:5px}
.tasklist .tn{font-weight:600}
.tasklist .tp{font-size:12px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sel);border-radius:14px;padding:2px 10px;font-size:13px}
.chip b{cursor:pointer;color:var(--ink-3)}
.sug{position:relative}
.sug ul{position:absolute;z-index:5;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:4px;max-height:260px;overflow:auto;margin:2px 0 0;padding:0;list-style:none;box-shadow:0 6px 18px rgba(28,35,64,.12)}
.sug li{padding:6px 10px;cursor:pointer;font-size:14px}
.sug li:hover,.sug li.hl{background:var(--sel)}
.sug li small{color:var(--ink-3);margin-left:8px}
.depth-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}
.depth-legend div{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:13px;background:#fff}
.depth-legend b{display:block;color:var(--accent)}
.cat-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cat-tabs button{padding:5px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;font-size:13px}
.cat-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cat-tabs button .c{margin-left:6px;color:var(--accent)}
.cat-tabs button.on .c{color:#f5d98a}
.sub-h td{background:#f2f3f8;font-weight:600;color:var(--ink-2);font-size:13px}
.summary dl{display:grid;grid-template-columns:200px 1fr;gap:4px 12px;margin:0}
.summary dt{color:var(--ink-3)}
.summary pre{background:#fff;border:1px solid var(--line);padding:12px;border-radius:4px;max-height:360px;overflow:auto;font-size:12px}
.badge-ok{color:var(--ok);font-weight:700}
.badge-ng{color:var(--ng);font-weight:700}
.tbl-scroll{overflow-x:auto;max-width:100%}
.tbl-scroll table.mx{min-width:540px}
body{overflow-x:hidden}
main{max-width:880px;width:100%}
.welcome{max-width:640px}
.welcome h2{font-size:26px;margin-bottom:6px}
.welcome .big{font-size:40px;font-weight:700;color:var(--accent);line-height:1.1}
.welcome ul{padding-left:20px;color:var(--ink-2)}
.welcome li{margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg span{padding:4px 10px;cursor:pointer;font-size:13px;border-right:1px solid var(--line);background:#fff;white-space:nowrap}
.seg span:last-child{border-right:0}
.seg span.on{background:var(--ink);color:#fff}
.seg span:hover:not(.on){background:var(--sel)}
.pre-pill{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--accent-soft);color:#6a4a0a;font-size:12px}
.optional{margin:6px 0 14px}
.optional > button{background:transparent;border:0;color:var(--accent);cursor:pointer;padding:6px 0;font-size:13px;text-decoration:underline}
.optional .q{background:#fbfbf9}
.filter{display:flex;gap:10px;align-items:center;margin:0 0 10px}
.filter input{flex:1}
.q.compact{padding:12px 16px;margin-bottom:10px}
.q.compact .qh{margin-bottom:6px}
.count{font-size:12px;color:var(--ink-3);margin-left:8px;font-weight:400}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:56px auto 1fr}
  nav.rail{display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line);height:auto;position:static}
  nav.rail button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;padding:10px 12px}
  nav.rail button.active{border-bottom-color:var(--accent)}
  nav.rail button .m{display:none}
  main{padding:18px 16px 80px}
  .q .body,.q .hint{margin-left:0}
  .depth-legend{grid-template-columns:1fr 1fr}
  header.top .prog{display:none}
  .seg{flex-wrap:wrap}
  .filter{flex-wrap:wrap}
  .tl .axis{flex-wrap:wrap;row-gap:2px}
  table.mx{table-layout:fixed;word-break:break-word}
  .tbl-scroll table.mx{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- welcome v2 ---- */
.w2{min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;max-width:680px;margin:0 auto;text-align:center;padding:40px 8px}
.w2 .eyebrow{letter-spacing:.3em;font-size:12px;color:var(--accent);font-weight:700;margin-bottom:14px}
.w2 h2{font-size:34px;letter-spacing:.02em;margin-bottom:12px}
.w2 .lead2{color:var(--ink-2);margin:0 0 28px;font-size:15px}
.w2 .rule{width:56px;height:3px;background:var(--accent);margin:0 auto 28px;border-radius:2px}
.w2 .times{display:flex;gap:12px;justify-content:center;margin-bottom:26px;flex-wrap:wrap}
.w2 .tcard{border:1px solid var(--line);border-radius:8px;background:#fff;padding:14px 22px;min-width:158px}
.w2 .tcard.hero{border-color:var(--accent);background:var(--accent-soft)}
.w2 .tcard .tl{font-size:12px;color:var(--ink-3);margin-bottom:2px;white-space:nowrap}
.w2 .tcard .tv{font-size:22px;font-weight:700;color:var(--ink)}
.w2 .tcard.hero .tv{color:#8a5f0b;font-size:26px}
.w2 .note2{font-size:13px;color:var(--ink-3);margin-bottom:32px}
.w2 .btn{padding:12px 52px;font-size:16px;border-radius:6px}
@media (max-width:820px){.w2{min-height:auto;padding:26px 2px}.w2 h2{font-size:26px}.w2 .times{flex-direction:column;align-items:stretch}.w2 .tcard{min-width:0}}

/* ---- welcome v3 ---- */
.w3{max-width:820px;margin:4vh auto 0;border-radius:14px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1c2340 0%,#232c52 55%,#2a3560 100%);color:#eef0f8;
  padding:72px 56px 64px;text-align:center;box-shadow:0 24px 60px rgba(28,35,64,.28)}
.w3::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(240,214,138,.14) 1px,transparent 1.5px);
  background-size:22px 22px;mask-image:radial-gradient(circle at 80% 0%,black 0%,transparent 60%);
  -webkit-mask-image:radial-gradient(circle at 80% 0%,black 0%,transparent 60%);pointer-events:none}
.w3::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#b07a12,#f0d68a,#b07a12)}
.w3 .eyebrow3{letter-spacing:.42em;font-size:11px;color:#f0d68a;font-weight:700;margin-bottom:22px;text-indent:.42em}
.w3 h2{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:600;
  font-size:40px;letter-spacing:.08em;color:#fff;margin:0 0 16px}
.w3 .lead3{color:#c3c9e2;font-size:15px;margin:0 auto 40px;max-width:34em}
.w3 .clock{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;
  width:168px;height:168px;border-radius:50%;border:1px solid rgba(240,214,138,.55);
  background:radial-gradient(circle at 50% 38%,rgba(240,214,138,.10),rgba(240,214,138,0) 70%);margin-bottom:40px}
.w3 .clock .cl{font-size:12px;letter-spacing:.2em;color:#d9c07a;text-indent:.2em}
.w3 .clock .cv{font-size:34px;font-weight:700;color:#f5e2a8;letter-spacing:.04em}
.w3 .note3{font-size:12.5px;color:#9aa1c4;margin-bottom:36px}
.w3 .btn3{display:inline-block;padding:14px 72px;font-size:16px;font-weight:700;letter-spacing:.3em;text-indent:.3em;
  color:#1c2340;background:linear-gradient(180deg,#f2d98e,#d9ab3c);border:0;border-radius:8px;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s}
.w3 .btn3:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,0,0,.4)}
.w3 .btn3:active{transform:translateY(0)}
@media (max-width:820px){.w3{margin:0 -4px;border-radius:10px;padding:52px 22px 46px}.w3 h2{font-size:29px;letter-spacing:.05em}.w3 .clock{width:148px;height:148px}.w3 .clock .cv{font-size:29px}.w3 .btn3{width:100%;padding:14px 0}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>従業員スキル調査</h1>
    <div class="prog"><span id="progText">回答率 0%</span><div class="bar"><i id="progBar"></i></div><span id="remain">残り約25分</span></div>
    <div class="tools">
      <button id="btnSave" title="回答をJSONファイルに保存">保存</button>
      <button id="btnLoad" title="保存したJSONを読み込み">読込</button>
      <input type="file" id="fileLoad" accept="application/json" style="display:none">
    </div>
  </header>
  <nav class="rail" id="rail"></nav>
  <main id="main"></main>

  // 案件で選んだ製品をCへ自動連携(L2仮置き・最終使用時期は案件期間から)
  {
    const now=2026*12+9, c=S.C;
    S.B.forEach(p=>{
      const endM=p.cur==='はい'?now:(p.ey?(+p.ey*12+(+p.em||12)):null);
      p.prods.forEach(id=>{
        if(c.cleared[id]) return;
        const pr=D.products.find(x=>x.id===id); if(!pr) return;
        if(!c.cats.includes(pr.cat)) c.cats.push(pr.cat);
        if(!c.depth[id]){ c.depth[id]='L2'; c.fromProj[id]=true; }
        if(c.fromProj[id]&&endM){
          const ago=now-endM;
          const lu=ago<12?'1年以内':(ago<36?'1〜3年前':'3年以上前');
          if(!c.last[id]||['1年以内','1〜3年前','3年以上前'].indexOf(lu)<['1年以内','1〜3年前','3年以上前'].indexOf(c.last[id])) c.last[id]=lu;
        }
      });
    });
  }
  const started=S.B.filter((p,i)=>projStarted(p,i));
  if(!S.Z.lock.role){const ranks=started.map(p=>ROLE_ORDER.indexOf(p.role)).filter(x=>x>=0);S.Z.role=ranks.length?ROLE_ORDER[Math.max(...ranks)]:'';}
  if(!S.Z.lock.lead){const m=started.filter(p=>ROLE_ORDER.indexOf(p.role)>=1).reduce((x,p)=>x+projMonths(p),0);S.Z.lead=bandOf(m);}
  if(!S.Z.lock.ops){const m=started.filter(p=>{const t=D.tasks.find(x=>x.no===p.main);return t&&['A','B'].includes(t.area);}).reduce((x,p)=>x+projMonths(p),0);S.Z.ops=bandOf(m);}
  if(!S.Z.lock.mgmt){const m=started.filter(p=>{const t=D.tasks.find(x=>x.no===p.main);return (t&&t.area==='R')||ROLE_ORDER.indexOf(p.role)>=2;}).reduce((x,p)=>x+projMonths(p),0);S.Z.mgmt=bandOf(m);}
}

/* ---------- validation ---------- */
function projErrors(p){
  const e=[];
  if(!p.cur) e.push('B-1'); if(!p.sy||!p.sm) e.push('B-2'); if(p.cur!=='はい'&&(!p.ey||!p.em)) e.push('B-3');
  if(!p.style) e.push('B-4'); if(!p.inds.length) e.push('B-5');
  if(!p.areas.length) e.push('B-9a'); if(!p.tasks.length) e.push('B-9b'); if(!p.main) e.push('B-9c');
  if(!p.role) e.push('B-10'); if(p.cur==='はい'&&!p.prods.length) e.push('B-12'); if(p.cur==='はい'&&!p.ai) e.push('B-16');
  return e;
}
const projStarted = (p,i)=> i===0 || !!(p.sy||p.tasks.length);
function secErrors(k){
  const e=[];
  if(k==='P'){ if(!S.P.err) e.push('P-2'); }
  if(k==='A'){ const a=S.A; if(!a.exp) e.push('A-1'); if(a.exp==='あり'){ if(!a.sy||!a.sm) e.push('A-2'); if(!a.lockMain&&(a.mainCands||[]).length>1&&!a.mainLayer) e.push('A-5'); } }
  if(k==='B'){ if(S.A.exp==='あり') S.B.forEach((p,i)=>{ if(projStarted(p,i)) projErrors(p).forEach(x=>e.push(`案件${i+1} ${x}`)); }); }
  if(k==='C'){ if(!S.C.cats.length) e.push('C-1'); }
  if(k==='D'){ }
  if(k==='E'){ if(S.E.jobs.length){ if(!S.E.years) e.push('E-2'); } }
  return [...new Set(e)];
}
function progress(){
  const keys=['P','A','B','C','D','E'].filter(k=>!(k==='B'&&S.A.exp&&S.A.exp!=='あり'));
  const done=keys.filter(k=>secErrors(k).length===0 && touched(k)).length;
  return {done, total:keys.length};
}
function touched(k){
  if(k==='P') return !!S.P.err; if(k==='A') return !!S.A.exp;
  if(S.visited[k]) return true; if(k==='B') return S.B.some(p=>p.sy&&p.type); if(k==='C') return S.C.cats.length>0; if(k==='D') return S.sec!=='D'&&SECTIONS.findIndex(x=>x.k===S.sec)>SECTIONS.findIndex(x=>x.k==='D')||Object.keys(S.D.certs).length>0; if(k==='E') return S.E.jobs.length>0; return false;
}

function render(scrollTop){
  const _y=window.scrollY;
  applyDerived();
  const _idx=SECTIONS.findIndex(x=>x.k===S.sec);
  for(let j=1;j<_idx;j++){S.visited[SECTIONS[j].k]=true;}
  const {done,total}=progress();
  byId('progText').textContent=`${done}/${total} 画面 完了`;
  byId('progBar').style.width=(done/total*100)+'%';
  const rem=SECTIONS.filter(s=>s.k!=='Z'&&s.k!=='W'&&!(s.k==='B'&&S.A.exp&&S.A.exp!=='あり')&&!(secErrors(s.k).length===0&&touched(s.k))).reduce((a,s)=>a+(s.k==='B'?3*Math.max(1,S.B.filter((p,i)=>projStarted(p,i)).length):s.est),0);
  byId('remain').textContent=S.sec==='W'?'':`残り約${Math.ceil(rem)}分`;

  const R={W:renderW,P:renderP,A:renderA,B:renderB,C:renderC,D:renderD,E:renderE,Z:renderZ};
  const idx=SECTIONS.findIndex(s=>s.k===S.sec);
  let h=R[S.sec]();
  if(S.sec!=='Z'&&S.sec!=='W') h+=`<div class="foot">${idx>1?`<button class="btn ghost" data-act="prev">戻る</button>`:'<span></span>'}<button class="btn" data-act="next">次へ</button></div>`;

}

function bindProductSearch(){
  const inp=byId('prodSearch'), ul=byId('prodSug'); if(!inp) return;
  const p=S.B[S.pIdx];
  const show=()=>{const q=inp.value.trim().toLowerCase();if(q.length<1){ul.style.display='none';return;}
    const score=x=>{const n=x.name.toLowerCase(),al=x.alias.split(' ');if(n===q||al.includes(q))return 0;if(n.startsWith(q)||al.some(a=>a.startsWith(q)))return 1;if(n.includes(q))return 2;if(x.alias.includes(q))return 3;if(x.sub.toLowerCase().includes(q))return 4;return 9;};
    const hits=D.products.filter(x=>!p.prods.includes(x.id)).map(x=>[score(x),x]).filter(([sc])=>sc<9).sort((a,b)=>a[0]-b[0]).slice(0,30).map(([,x])=>x);
    ul.innerHTML=hits.length?hits.map(x=>`<li data-act="B.p.prods.add" data-v="${x.id}">${esc(x.name)}<small>${esc(x.cat)} / ${esc(x.sub)}</small></li>`).join(''):`<li style="color:var(--ink-3)">該当なし — B-12の下「リストにない製品」はC-4で登録できます</li>`;

function setPath(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val;}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, v=el.dataset.v;
  if(el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA') return; // handled by change
  if(act==='go'){S.sec=v;render(true);return;}
  if(act==='next'){if(S.sec==='W'){S.sec='P';render();return;}const errs=secErrors(S.sec);if(errs.length){S.showErr=true;render();const first=document.querySelector('.q.err');if(first)first.scrollIntoView({behavior:'smooth',block:'center'});return;}S.showErr=false;const i=SECTIONS.findIndex(s=>s.k===S.sec);let n=SECTIONS[i+1].k;if(n==='B'&&S.A.exp!=='あり')n='C';S.sec=n;render(true);return;}
  if(act==='prev'){const i=SECTIONS.findIndex(s=>s.k===S.sec);let n=SECTIONS[i-1].k;if(n==='B'&&S.A.exp!=='あり')n='A';S.sec=n;S.showErr=false;render(true);return;}
  if(act==='B.select'){S.pIdx=+v;render(true);return;}
  if(act==='B.add'){if(S.B.length<2){S.B.push(newProject(false));S.pIdx=S.B.length-1;render(true);}return;}
  if(act==='B.copy'){if(S.B.length<2){const src=S.B[S.pIdx];const np=JSON.parse(JSON.stringify(src));np.pre=false;np.cur='いいえ';np.sy='';np.sm='';np.ey='';np.em='';np.note='';S.B.push(np);S.pIdx=S.B.length-1;render(true);}return;}
  if(act==='opt'){S.optOpen[v]=!S.optOpen[v];render();return;}
  if(act==='C.sub'){S.optOpen[v]=!S.optOpen[v];render();return;}
  if(act.startsWith('A.layer:')){S.A.layers[act.split(':')[1]]=v;render();return;}
  if(act.startsWith('C.last:')){S.C.last[act.split(':')[1]]=v;render();return;}
  if(act.startsWith('D.st:')){S.D.certs[act.split(':')[1]].st=v;render();return;}
  if(act==='D.add'||act==='D.tog'){if(S.D.certs[v]){if(act==='D.tog')delete S.D.certs[v];}else S.D.certs[v]={st:'有効',year:''};if(act==='D.add')S.D.filter='';render();return;}
  if(act==='D.rm'){delete S.D.certs[v];render();return;}
  if(act==='B.remove'){ev.stopPropagation();if(confirm(`案件${+v+1}を削除しますか`)){S.B.splice(+v,1);S.pIdx=Math.min(S.pIdx,S.B.length-1);render(true);}return;}
  if(act==='B.p.prods.add'){const p=S.B[S.pIdx];if(p.prods.length<8&&!p.prods.includes(v))p.prods.push(v);render();setTimeout(()=>byId('prodSearch')?.focus(),0);return;}
  if(act==='B.p.prods.rm'){const p=S.B[S.pIdx];p.prods=p.prods.filter(x=>x!==v);render();return;}
  if(['Z.role','Z.lead','Z.ops','Z.mgmt'].includes(act)){const k=act.slice(2);S.Z[k]=v;S.Z.lock[k]=true;render();return;}
  if(act==='C.cat'){toggle(S.C.cats,v);render();return;}
  if(act==='C.depth'){const id=el.dataset.id;if(v){S.C.depth[id]=v;delete S.C.fromProj[id];if(v!=='L1'&&!S.C.last[id])S.C.last[id]='1年以内';}else{delete S.C.depth[id];delete S.C.last[id];if(S.C.fromProj[id]){delete S.C.fromProj[id];S.C.cleared[id]=true;}}if(v==='L1')delete S.C.last[id];render();return;}
  if(act==='D.toggle'){S.optOpen['Dc:'+v]=!S.optOpen['Dc:'+v];render();return;}
  if(act==='submit'){submitAnswers();return;}
});
async function submitAnswers(){
  const out=byId('out');
  out.innerHTML=`<div class="q summary"><p style="margin-top:0">送信中…</p></div>`;
  out.scrollIntoView({behavior:'smooth'});
  try{
    const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({employee_id:PRE.emp,answers:exportData()})});
    const json=await res.json();
    if(json.ok){
      out.innerHTML=`<div class="q summary"><p style="margin-top:0"><span class="badge-ok">送信しました。</span> ご回答ありがとうございました。</p></div>`;
    }else{
      out.innerHTML=`<div class="q summary err"><p style="margin-top:0"><span class="badge-ng">送信に失敗しました: ${esc(json.error||'')}</span></p></div>`;
    }
  }catch(err){
    out.innerHTML=`<div class="q summary err"><p style="margin-top:0"><span class="badge-ng">通信エラー: ${esc(err.message)}</span></p></div>`;
  }
  out.scrollIntoView({behavior:'smooth'});
}
document.addEventListener('change',ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act; const v=el.dataset.v!==undefined?el.dataset.v:el.value;
  if(act==='A.main'){S.A.mainLayer=v;S.A.lockMain=true;render();return;}
  if(act==='A.main2'){S.A.main2=v;S.A.lockMain2=true;render();return;}
  if(act.startsWith('B.p.')){const p=S.B[S.pIdx];const key=act.slice(4);
    if(key==='type'||key==='l1'){p[key]=v;p.lock[key]=true;render();return;}
    if(key==='l2'||key==='phase'){p.lock[key]=true;toggle(p[key],v,key==='l2'?3:undefined);render();return;}
    if(key==='tasks'){toggle(p.tasks,+v,8);if(!p.tasks.includes(p.main))p.main='';}
    else if(key==='main'){p.main=D.tasks.find(t=>t.name===v)?.no||'';}
    else if(['sys','areas','env','deliv','aiTasks','inds'].includes(key)){const max={sys:3,areas:4,inds:3}[key];toggle(p[key],v,max);
      if(key==='areas'){const codes=p.areas.map(a=>a[0]);p.tasks=p.tasks.filter(no=>codes.includes(D.tasks.find(t=>t.no===no).area));if(!p.tasks.includes(p.main))p.main='';}}
    else setPath(p,key,v);
    if(key==='cur'&&v==='はい'){p.ey='';p.em='';}
    render();return;}
  if(act.startsWith('A.layer:')){S.A.layers[act.split(':')[1]]=v;render();return;}
  if(act.startsWith('C.last:')){S.C.last[act.split(':')[1]]=v;render();return;}
  if(act.startsWith('C.other.')){const [k,i]=act.slice(8).split(':');S.C.other[+i][k]=v;return;}
  if(act.startsWith('D.other.')){const [k,i]=act.slice(8).split(':');S.D.other[+i][k]=v;return;}
    if(act.startsWith('D.st:')){S.D.certs[act.split(':')[1]].st=v;render();return;}
  if(act.startsWith('D.year:')){S.D.certs[act.split(':')[1]].year=v;return;}
  if(act==='E.jobs'){toggle(S.E.jobs,v);render();return;}
  if(act==='E.content'){S.E.lockContent=true;toggle(S.E.content,v);render();return;}
  if(act.startsWith('P.')||act.startsWith('A.')||act.startsWith('E.')){setPath(S,act,v);render();return;}
});
function exportData(){
  const T=n=>D.tasks.find(t=>t.no===n);
  return {
    T1_回答者:{employee_id:PRE.emp,ledger_correction_flag:S.P.err==='はい',ledger_correction:S.P.fix,it_experience:S.A.exp,it_start_ym:S.A.sy?`${S.A.sy}-${String(S.A.sm).padStart(2,'0')}`:'',blank_years_band:S.A.blank,main_layer:{value:S.A.mainLayer,source:S.A.lockMain?'手動修正':'自動'},second_layer:{value:S.A.main2,source:S.A.lockMain2?'手動修正':'自動'},max_role:{value:S.Z.role,source:S.Z.lock.role?'手動修正':'自動'},leader_years_band:{value:S.Z.lead,source:S.Z.lock.lead?'手動修正':'自動'},ops_years_band:{value:S.Z.ops,source:S.Z.lock.ops?'手動修正':'自動'},mgmt_years_band:{value:S.Z.mgmt,source:S.Z.lock.mgmt?'手動修正':'自動'},non_it_years_band:S.E.years,non_it_content:{value:S.E.content,source:S.E.lockContent?'手動修正':'自動'},answered_at:new Date().toISOString()},
    T1a_レイヤ経験:Object.entries(S.A.layers).map(([layer_code,years_band])=>({layer_code,years_band})),
    T1b_非IT職務:S.E.jobs.map(nonit_code=>({nonit_code})), T1b_非IT内容:S.E.content,
    T2_案件:S.A.exp==='あり'?S.B.map((p,i)=>({project_id:`${PRE.emp}-${i+1}`,is_current:p.cur==='はい',start_ym:`${p.sy}-${String(p.sm).padStart(2,'0')}`,end_ym:p.cur==='はい'?'継続中':`${p.ey}-${String(p.em).padStart(2,'0')}`,work_style:p.style,industries:p.inds,system_types:p.sys,project_type:{value:p.type,source:p.lock.type?'手動修正':'自動'},main_layer:{value:p.l1,source:p.lock.l1?'手動修正':'自動'},sub_layers:p.l2,phases:{value:p.phase,source:p.lock.phase?'手動修正':'自動'},areas:p.areas,tasks:p.tasks.map(n=>({task_no:n,task:T(n)?.name})),main_task_no:p.main,main_task_ratio:p.ratio,other_task:p.otherTask,role:p.role,team_size:p.team,ai_level:p.ai,ai_tasks:p.aiTasks,products:p.prods.map(id=>({product_id:id,name:D.products.find(x=>x.id===id)?.name})),env:p.env,deliverables:p.deliv,note:p.note})):[],
    T3_製品深度:Object.entries(S.C.depth).map(([product_id,depth])=>({product_id,name:D.products.find(x=>x.id===product_id)?.name,depth,last_used:S.C.last[product_id]||''})),
    T3a_製品追補:S.C.other.filter(o=>o.text), T4_資格:Object.entries(S.D.certs).map(([cert_id,c])=>({cert_id,name:D.certs.find(x=>x.id===cert_id)?.name,status:c.st,acquired_year:c.year})), T4a_資格追補:S.D.other.filter(o=>o.text),
  };
}
byId('btnSave').onclick=()=>{const b=new Blob([JSON.stringify({state:S},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`skill_survey_${PRE.emp}.json`;a.click();};
byId('btnLoad').onclick=()=>byId('fileLoad').click();
byId('fileLoad').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.state){Object.assign(S,o.state);render(true);}}catch(e){alert('読み込めませんでした: '+e.message);}};r.readAsText(f);};
renderLogin();
</script>
